plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"

    id "org.jetbrains.kotlin.android"

   // id 'com.google.gms.google-services'


}

def kotlin_version = rootProject.ext.kotlin_version // ✅ Added to sync Kotlin version

android {
    namespace = "com.spark.turningPoint"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding = true
    }

    defaultConfig {
        applicationId = "com.spark.turningPoint"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile file("D:\\sayyn_1\\upload-keystore.jks")
            storePassword "buqcha"
            keyAlias "buqcha"
            keyPassword "buqcha"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug

            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version" // ✅ Synced version
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
   // implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.android.installreferrer:installreferrer:2.2'

   // implementation platform('com.google.firebase:firebase-bom:34.4.0')
}
